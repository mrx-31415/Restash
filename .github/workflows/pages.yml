name: Publish docs + plugin source

# Builds the MkDocs Material documentation site AND the Stash plugin source
# (index.yml + restash.zip), then deploys both to GitHub Pages from one _site/.
#
#   Docs homepage: https://espionage9248.github.io/Restash/
#   Plugin source: https://espionage9248.github.io/Restash/index.yml
#
# Users add the plugin-source URL in Stash → Settings → Plugins → Available
# Plugins → Add Source. mkdocs runs first (it cleans _site/), then
# build_source.sh layers the manifest on top — see docs "Publishing the site".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build_source.sh needs git history for version + date
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install docs toolchain
        run: pip install -r requirements-docs.txt
      - name: Build docs site
        run: mkdocs build   # writes _site/ (clean build)
      - name: Build plugin source manifest
        run: bash scripts/build_source.sh   # adds index.yml + restash.zip to _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
