site_name: Restash
site_description: Freshness scoring for Stash scenes and performers, written into custom_fields.
site_url: https://espionage9248.github.io/Restash/
repo_url: https://github.com/Espionage9248/Restash
repo_name: Espionage9248/Restash
copyright: Copyright &copy; 2026 Espionage9248 — MIT licensed

# Author docs from a tracked directory. The default `docs/` is gitignored in this
# repo (internal plans/specs), so MkDocs reads from `documentation/` instead.
docs_dir: documentation

# Build straight into the GitHub Pages artifact dir. The Pages workflow runs
# `mkdocs build` first (clean), then layers the plugin source manifest
# (index.yml + restash.zip) on top so the Stash plugin-source URL keeps working.
site_dir: _site

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - User Guide:
      - Installation: install.md
      - Usage: usage.md
      - Settings: settings.md
      - Reading the scores: reading-scores.md
      - Scheduling: scheduling.md
      - How scoring works: how-it-works.md
      - Troubleshooting: troubleshooting.md
  - Developer:
      - Development: development.md
      - Releasing: releasing.md
      - Publishing the site: publishing.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
